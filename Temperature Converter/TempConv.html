<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="TempConvStyle.css">
    <link rel="icon" href="images/TempLogo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
</head>
<body>
    <div class="container">
        <h1 class="Heading">Temprtature Converter</h1>
        <div class="temp-container">
            <label for="Celcius"> Celcius</label>
            <input 
            oninput="computeTemp(event)"
            type="number" name="Celcius" id="Celcius" class="Celcius" placeholder="Enter Temperature">
        </div>
        <div class="temp-container">
            <label for="Farenheit"> Farenheit</label>
            <input 
            oninput="computeTemp(event)"
            type="number" name="Farenheit" id="Farenheit" class="Farenheit" placeholder="Enter Temperature">
        </div>
         <div class="temp-container">
            <label for="Kelvin"> Kelvin</label>
            <input 
            oninput="computeTemp(event)"
            type="number" name="Kelvin" id="Kelvin" class="Kelvin" placeholder="Enter Temperature">
        </div>
    </div>
    <script src="TempConvScript.js"></script>
</body>
</html>
